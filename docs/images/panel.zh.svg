<svg xmlns="http://www.w3.org/2000/svg" width="720" height="456" viewBox="0 0 720 456" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <!-- Panel frame -->
  <rect x="6" y="6" width="708" height="444" rx="14" fill="#ffffff" stroke="#e3e6ea" stroke-width="1.5"/>
  <rect x="6" y="6" width="708" height="444" rx="14" fill="none" stroke="#000" stroke-opacity="0.04"/>

  <!-- Header: filter -->
  <rect x="24" y="22" width="300" height="28" rx="8" fill="#f5f6f8" stroke="#e3e6ea"/>
  <circle cx="40" cy="34" r="6" fill="none" stroke="#81858c" stroke-width="1.6"/>
  <line x1="44.5" y1="38.5" x2="49" y2="43" stroke="#81858c" stroke-width="1.6" stroke-linecap="round"/>
  <text x="56" y="39" font-size="12" fill="#81858c">筛选能力…</text>
  <text x="340" y="41" font-size="11" fill="#81858c">4 / 4</text>

  <!-- Tabs -->
  <g font-size="12">
    <rect x="24" y="62" width="88" height="26" rx="7" fill="#eef3fe"/>
    <text x="68" y="79" text-anchor="middle" fill="#4176e6" font-weight="600">技能 4</text>
    <rect x="118" y="62" width="80" height="26" rx="7" fill="none"/>
    <text x="158" y="79" text-anchor="middle" fill="#61666b">MCP 2</text>
    <rect x="204" y="62" width="80" height="26" rx="7" fill="none"/>
    <text x="244" y="79" text-anchor="middle" fill="#61666b">工具 3</text>
  </g>

  <!-- Skill row 1: loaded -->
  <g>
    <rect x="24" y="100" width="672" height="40" rx="8" fill="#ffffff"/>
    <circle cx="40" cy="120" r="5" fill="#4176e6"/>
    <text x="54" y="124" font-size="13" fill="#0f1115">find-skills</text>
    <rect x="136" y="110" width="64" height="20" rx="10" fill="#22c55e" fill-opacity="0.14"/>
    <text x="168" y="124" text-anchor="middle" font-size="11" fill="#22c55e">已加载</text>
    <!-- switch on -->
    <rect x="648" y="110" width="32" height="19" rx="9.5" fill="#4176e6"/>
    <circle cx="670.5" cy="119.5" r="7" fill="#ffffff"/>
  </g>

  <!-- Skill row 2: pruned -->
  <g>
    <rect x="24" y="144" width="672" height="40" rx="8" fill="#ffffff"/>
    <circle cx="40" cy="164" r="5" fill="#4176e6"/>
    <text x="54" y="168" font-size="13" fill="#0f1115">lark-im</text>
    <rect x="112" y="154" width="70" height="20" rx="10" fill="#4176e6" fill-opacity="0.14"/>
    <text x="147" y="168" text-anchor="middle" font-size="11" fill="#4176e6">已截断</text>
    <rect x="648" y="154" width="32" height="19" rx="9.5" fill="#4176e6"/>
    <circle cx="670.5" cy="163.5" r="7" fill="#ffffff"/>
  </g>

  <!-- Skill row 3: evicted, with load count -->
  <g>
    <rect x="24" y="188" width="672" height="40" rx="8" fill="#ffffff"/>
    <circle cx="40" cy="208" r="5" fill="#4176e6"/>
    <text x="54" y="212" font-size="13" fill="#0f1115">deep-research</text>
    <rect x="152" y="198" width="78" height="20" rx="10" fill="#f59e0b" fill-opacity="0.14"/>
    <text x="191" y="212" text-anchor="middle" font-size="11" fill="#f59e0b">已挤出 ×2</text>
    <rect x="648" y="198" width="32" height="19" rx="9.5" fill="#4176e6"/>
    <circle cx="670.5" cy="207.5" r="7" fill="#ffffff"/>
  </g>

  <!-- Skill row 4: unloaded, switch off, insert (paper plane) -->
  <g>
    <rect x="24" y="232" width="672" height="40" rx="8" fill="#ffffff"/>
    <circle cx="40" cy="252" r="5" fill="#4176e6"/>
    <text x="54" y="256" font-size="13" fill="#0f1115">pdf-tools</text>
    <rect x="118" y="242" width="76" height="20" rx="10" fill="#81858c" fill-opacity="0.14"/>
    <text x="156" y="256" text-anchor="middle" font-size="11" fill="#81858c">未加载</text>
    <!-- paper plane -->
    <g transform="translate(616,244)" stroke="#81858c" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 8 L15 1 L10 15 L7.5 10.5 Z"/>
    </g>
    <!-- switch off -->
    <rect x="648" y="242" width="32" height="19" rx="9.5" fill="#d8dbe0"/>
    <circle cx="657.5" cy="251.5" r="7" fill="#ffffff"/>
  </g>

  <!-- MCP server row -->
  <g>
    <rect x="24" y="284" width="672" height="40" rx="8" fill="#ffffff"/>
    <path d="M36 296 l5 6 5-6" stroke="#81858c" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-90 41 299)"/>
    <text x="54" y="308" font-size="13" fill="#0f1115" font-weight="600">yunxiao</text>
    <text x="120" y="308" font-size="12" fill="#81858c">12 工具</text>
    <rect x="648" y="294" width="32" height="19" rx="9.5" fill="#4176e6"/>
    <circle cx="670.5" cy="303.5" r="7" fill="#ffffff"/>
  </g>

  <!-- MCP server expanded: doubao-search -->
  <g>
    <rect x="24" y="328" width="672" height="40" rx="8" fill="#ffffff"/>
    <path d="M36 340 l5 6 5-6" stroke="#81858c" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="54" y="352" font-size="13" fill="#0f1115" font-weight="600">doubao-search</text>
    <text x="146" y="352" font-size="12" fill="#81858c">2 工具</text>
    <rect x="648" y="338" width="32" height="19" rx="9.5" fill="#4176e6"/>
    <circle cx="670.5" cy="347.5" r="7" fill="#ffffff"/>
  </g>
  <g>
    <rect x="44" y="372" width="652" height="32" rx="8" fill="#fafbfc"/>
    <text x="62" y="393" font-size="12" fill="#61666b">web_search</text>
    <rect x="648" y="378" width="28" height="17" rx="8.5" fill="#4176e6"/>
    <circle cx="668" cy="386.5" r="6" fill="#ffffff"/>
  </g>
  <g>
    <rect x="44" y="408" width="652" height="32" rx="8" fill="#fafbfc"/>
    <text x="62" y="429" font-size="12" fill="#61666b">image_search</text>
    <rect x="648" y="414" width="28" height="17" rx="8.5" fill="#d8dbe0"/>
    <circle cx="657" cy="422.5" r="6" fill="#ffffff"/>
  </g>
</svg>
